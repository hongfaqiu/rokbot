name: rokbot-host
services:
  host:
    # Override with ROKBOT_HOST_IMAGE=ghcr.io/hongfaqiu/rokbot/host:latest when using prebuilt images.
    image: ${ROKBOT_HOST_IMAGE:-${GROKBOT_HOST_IMAGE:-rokbot-host:local}}
    init: true
    restart: unless-stopped
    ports:
      - "${ROKBOT_LISTEN_ADDRESS:-${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}}:${ROKBOT_PUBLIC_PORT:-${GROKBOT_PUBLIC_PORT:-18080}}:8000"
      - "${ROKBOT_LISTEN_ADDRESS:-${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}}:${ROKBOT_WEB_PUBLIC_PORT:-${GROKBOT_WEB_PUBLIC_PORT:-18081}}:8001"
    environment:
      ROKBOT_PUBLIC_URL: ${ROKBOT_PUBLIC_URL:-${GROKBOT_PUBLIC_URL:-}}
      ROKBOT_BLOB_DB_QUICK_CHECK_MAX_BYTES: ${ROKBOT_BLOB_DB_QUICK_CHECK_MAX_BYTES:-${GROKBOT_BLOB_DB_QUICK_CHECK_MAX_BYTES:-}}
      ROKBOT_PUBLIC_PORT: ${ROKBOT_PUBLIC_PORT:-${GROKBOT_PUBLIC_PORT:-18080}}
      ROKBOT_WEB_PUBLIC_URL: ${ROKBOT_WEB_PUBLIC_URL:-${GROKBOT_WEB_PUBLIC_URL:-}}
      ROKBOT_WEB_PUBLIC_PORT: ${ROKBOT_WEB_PUBLIC_PORT:-${GROKBOT_WEB_PUBLIC_PORT:-18081}}
      ROKBOT_REQUIRE_EXECUTION_NODE: "1"
      ROKBOT_ALLOW_DEVICE_MODEL_CONFIG: ${ROKBOT_ALLOW_DEVICE_MODEL_CONFIG:-1}
      ROKBOT_TTS_ENDPOINT: ${ROKBOT_TTS_ENDPOINT:-}
      ROKBOT_TTS_API_KEY: ${ROKBOT_TTS_API_KEY:-}
      ROKBOT_TTS_MODEL: ${ROKBOT_TTS_MODEL:-}
      ROKBOT_TTS_VOICE: ${ROKBOT_TTS_VOICE:-}
      ROKBOT_TTS_FORMAT: ${ROKBOT_TTS_FORMAT:-}
      ROKBOT_UPDATE_DIR: ${ROKBOT_UPDATE_DIR:-/data/updates}
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - host-data:/data
    healthcheck:
      test: ["CMD", "/exec-daemon/node", "deploy/healthcheck.mjs"]
      interval: 15s
      timeout: 15s
      start_period: 90s
      retries: 3
    stop_grace_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  host-data:
    name: ${COMPOSE_PROJECT_NAME}_host-data
    external: ${ROKBOT_EXISTING_VOLUMES:-${PROKBOT_EXISTING_VOLUMES:-false}}
